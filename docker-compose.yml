name: framerfordevs

services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        INTERNAL_SERVER_URL: http://server:3000
        VITE_DASHBOARD_ORIGIN: http://localhost:3001
        VITE_DEVELOPER_ORIGIN: http://localhost:3002
        VITE_MARKETING_ORIGIN: http://localhost:3003
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/dashboard/.env
        required: false
    environment:
      INTERNAL_SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  developers:
    build:
      context: .
      dockerfile: apps/developers/Dockerfile
      args:
        VITE_DASHBOARD_ORIGIN: http://localhost:3001
        VITE_DEVELOPER_ORIGIN: http://localhost:3002
        VITE_MARKETING_ORIGIN: http://localhost:3003
    init: true
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/docs').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        VITE_DASHBOARD_ORIGIN: http://localhost:3001
        VITE_DEVELOPER_ORIGIN: http://localhost:3002
        VITE_MARKETING_ORIGIN: http://localhost:3003
    init: true
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      DASHBOARD_ORIGIN: http://localhost:3001
      OPERATOR_ORIGIN: http://operator.localhost:3000
      HOST_ROUTING_ENABLED: "true"
      TRUST_PROXY_HOPS: 1
      NODE_ENV: development
      OAUTH_DEVICE_AUTHORIZATION_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/framerfordevs
      TOOLING_API_RESOURCE: ${TOOLING_API_RESOURCE:-http://localhost:3000/api/tooling/v1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/framerfordevs
      DATABASE_POOL_MAX: 5
      NODE_ENV: development
      OTEL_SERVICE_NAME: framerfordevs-worker
      TOOLING_API_RESOURCE: ${TOOLING_API_RESOURCE:-http://localhost:3000/api/tooling/v1}
      WEBHOOK_WORKER_PORT: 3002
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    container_name: framerfordevs-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${RATE_LIMIT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: framerfordevs-postgres
    environment:
      POSTGRES_DB: framerfordevs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - framerfordevs_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  framerfordevs_postgres_data:
